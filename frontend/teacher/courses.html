<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Courses</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/courses.css">
</head>

<body>

  <!-- Sidebar injected by JS -->
  <div id="sidebar" class="sidebar"></div>

  <div class="main-content">

    <!-- Navbar injected by JS -->
    <div id="navbar" class="navbar"></div>

    <div class="page-content">

      <section class="page-header">
        <h1>Courses</h1>
        <button id="addCourseBtn" class="btn btn-primary">Add New Course</button>
      </section>

      <!-- Filters -->
      <div style="display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap;">
        <input type="text" id="courseSearch" class="search" placeholder="Search by title or description..." style="width:350px; margin:0;">
        <select id="statusFilter" onchange="renderCourses()">
          <option value="all">All Status</option>
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>

      <div class="courses-grid" id="coursesGrid"></div>

    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/courses.js"></script>

</body>
</html>
