<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Teachers — Admin Portal</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="sidebar" class="sidebar"></div>

  <div class="main-content">
    <div id="navbar" class="navbar"></div>

    <main class="page-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 class="navbar-page-title" style="font-size:24px;">Faculty Management</h1>
        <button class="btn btn-primary" onclick="openInviteModal()">+ Invite Teacher</button>
      </div>

      <!-- Filters -->
      <div class="table-card fade-up">
        <div style="padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px;">
            <input type="text" id="teacherSearch" class="search" placeholder="Search by name or email..." style="width:300px; margin:0; background-color: #f9fafb;">
            <select id="statusFilter" style="width:150px; padding: 8px;">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Teacher</th>
              <th>Email</th>
              <th>Courses</th>
              <th>Students</th>
              <th>Avg Score</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="teachersTableBody">
            <!-- Dynamic -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- INVITE MODAL -->
  <div id="inviteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header-custom">
            <button class="close-modal-custom" onclick="closeModal('inviteModal')">&times;</button>
            <h3>Invite New Teacher</h3>
            <p>Create a faculty account to manage courses.</p>
        </div>
        <div class="modal-body">
            <div class="form-group-custom">
                <label>Full Name</label>
                <input type="text" id="inviteName" class="form-input-custom" placeholder="e.g. Dr. Emily Smith">
            </div>
            <div class="form-group-custom">
                <label>Email Address</label>
                <input type="email" id="inviteEmail" class="form-input-custom" placeholder="teacher@email.com">
            </div>
            <div class="form-group-custom">
                <label>Temporary Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="invitePass" class="form-input-custom" placeholder="••••••••">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div style="margin-top:32px; display:flex; gap:12px;">
                <button class="btn btn-primary" style="flex:2; justify-content:center; padding:14px;" onclick="submitInvite()">Create Account</button>
                <button class="btn btn-ghost" style="flex:1; justify-content:center;" onclick="closeModal('inviteModal')">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <!-- RESET PASS MODAL -->
  <div id="resetModal" class="modal">
    <div class="modal-content">
        <div class="modal-header-custom" style="background: linear-gradient(135deg, #475569, #1e293b);">
            <button class="close-modal-custom" onclick="closeModal('resetModal')">&times;</button>
            <h3>Reset Password</h3>
            <p id="resetTeacherName">Update faculty security credentials.</p>
        </div>
        <div class="modal-body">
            <div class="form-group-custom">
                <label>New Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="newPass" class="form-input-custom" placeholder="••••••••">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="form-group-custom">
                <label>Confirm Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="confirmPass" class="form-input-custom" placeholder="••••••••">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div style="margin-top:32px; display:flex; gap:12px;">
                <button class="btn btn-primary" style="flex:2; justify-content:center; padding:14px; background:#1e293b;" onclick="submitReset()">Update Password</button>
                <button class="btn btn-ghost" style="flex:1; justify-content:center;" onclick="closeModal('resetModal')">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
