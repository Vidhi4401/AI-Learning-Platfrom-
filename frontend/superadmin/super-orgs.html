<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Organizations</title>
  <link rel="stylesheet" href="../admin/css/main.css">
  <style>
      .org-card {
          background: white;
          border-radius: 12px;
          padding: 20px;
          border: 1px solid #e2e8f0;
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
      }
      .org-name { font-weight: 700; font-size: 18px; color: #1e293b; }
      .org-platform { color: #64748b; font-size: 14px; margin-top: 4px; }
      
      .modal {
        display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
        width: 100%; height: 100%; background: rgba(0,0,0,0.5);
      }
      .modal-content {
        background: white; margin: 10% auto; padding: 30px; 
        border-radius: 15px; width: 400px;
      }
  </style>
</head>
<body>
  <div id="sidebar" class="sidebar"></div>
  <div class="main-content">
    <div id="navbar" class="navbar"></div>
    <div class="page-content">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <h1>Organizations</h1>
        <button class="btn btn-primary" id="manageOrgBtn">Manage Organization</button>
      </div>

      <div id="orgsList">
          <p>Loading organizations...</p>
      </div>

    </div>
  </div>

  <!-- Add Org Modal -->
  <div id="orgModal" class="modal">
    <div class="modal-content">
      <h2>Add Organization</h2>
      <div style="margin-top:20px;">
        <label style="display:block; margin-bottom:8px; font-weight:600;">Organization Name</label>
        <input type="text" id="newOrgName" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-bottom:15px;">
        
        <label style="display:block; margin-bottom:8px; font-weight:600;">Platform Title (e.g. LearnHub)</label>
        <input type="text" id="newOrgPlatform" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; margin-bottom:20px;">
        
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="addOrg()" id="saveBtn">Create Organization</button>
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/super-layout.js"></script>
  <script>
      const SUPER_API = "http://127.0.0.1:8000/api/v1/superadmin";

      document.addEventListener("DOMContentLoaded", loadOrgs);

      async function loadOrgs() {
          const res = await fetch(`${SUPER_API}/organizations`, {
              headers: { Authorization: "Bearer " + token }
          });
          const orgs = await res.json();
          const list = document.getElementById("orgsList");
          
          if (!orgs.length) {
              list.innerHTML = "<p>No organizations found.</p>";
              return;
          }

          list.innerHTML = orgs.map(o => `
            <div class="org-card">
                <div>
                    <div class="org-name">${o.name}</div>
                </div>
                <div style="color: #64748b; font-size:13px;">ID: ${o.id}</div>
            </div>
          `).join("");
            // Manage Organization button logic
            let manageMode = false;
            document.getElementById("manageOrgBtn").addEventListener("click", function() {
              manageMode = !manageMode;
              this.textContent = manageMode ? "Done" : "Manage Organization";
              loadOrgs();
            });

            // Modified loadOrgs to show delete button in manage mode
            async function loadOrgs() {
                const res = await fetch(`${SUPER_API}/organizations`, {
                    headers: { Authorization: "Bearer " + token }
                });
                const orgs = await res.json();
                const list = document.getElementById("orgsList");
                if (!orgs.length) {
                    list.innerHTML = "<p>No organizations found.</p>";
                    return;
                }
                list.innerHTML = orgs.map(o => `
                  <div class="org-card">
                      <div>
                          <div class="org-name">${o.name}</div>
                      </div>
                      <div style="display:flex; align-items:center; gap:10px; color: #64748b; font-size:13px;">
                        ID: ${o.id}
                        ${manageMode ? `<button class='btn btn-danger' onclick='deleteOrg(${o.id})'>Delete</button>` : ''}
                      </div>
                  </div>
                `).join("");
            }

            // Delete organization function
            async function deleteOrg(id) {
              if (!confirm("Are you sure you want to delete this organization?")) return;
              try {
                const res = await fetch(`${SUPER_API}/organizations/${id}`, {
                  method: "DELETE",
                  headers: { Authorization: "Bearer " + token }
                });
                if (res.ok) {
                  loadOrgs();
                } else {
                  alert("Failed to delete organization.");
                }
              } catch (e) {
                alert("Error deleting organization.");
              }
            }
      }

      function openModal() { document.getElementById("orgModal").style.display = "block"; }
      function closeModal() { document.getElementById("orgModal").style.display = "none"; }

      async function addOrg() {
          const name = document.getElementById("newOrgName").value;
          const platform = document.getElementById("newOrgPlatform").value;
          const btn = document.getElementById("saveBtn");

          if (!name) { alert("Name is required"); return; }

          btn.disabled = true;
          try {
              const res = await fetch(`${SUPER_API}/organizations`, {
                  method: "POST",
                  headers: { 
                      "Content-Type": "application/json",
                      Authorization: "Bearer " + token 
                  },
                  body: JSON.stringify({ name, platform_name: platform })
              });
              if (res.ok) {
                  closeModal();
                  loadOrgs();
                  document.getElementById("newOrgName").value = "";
                  document.getElementById("newOrgPlatform").value = "";
              }
          } catch(e) {}
          btn.disabled = false;
      }
  </script>
</body>
</html>
