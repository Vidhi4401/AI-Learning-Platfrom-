<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Dashboard</title>
  <link rel="stylesheet" href="../admin/css/main.css">
  <link rel="stylesheet" href="../admin/css/dashboard.css">
</head>
<body>
  <div id="sidebar" class="sidebar"></div>
  <div class="main-content">
    <div id="navbar" class="navbar"></div>
    <div class="page-content">
      
      <div style="margin-bottom: 30px;">
        <h1 style="font-size: 28px;">Platform Overview</h1>
        <p style="color: #64748b;">Welcome back, Global Administrator.</p>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Total Organizations</div>
          <div class="stat-value" id="totalOrgs">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Students</div>
          <div class="stat-value" id="totalStudents">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Teachers</div>
          <div class="stat-value" id="totalTeachers">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Courses</div>
          <div class="stat-value" id="totalCourses">0</div>
        </div>
      </div>

      <div class="table-card" style="margin-top: 30px; padding: 30px; text-align:center;">
          <h2 style="color: #1e293b;">Super Admin Actions</h2>
          <div style="display:flex; gap:20px; justify-content:center; margin-top:20px;">
              <a href="super-orgs.html" class="btn btn-primary" style="text-decoration:none; padding:15px 30px;">Manage Organizations</a>
              <a href="super-admins.html" class="btn btn-primary" style="text-decoration:none; padding:15px 30px; background:#1e293b;">Manage Admins</a>
              <a href="messages.html" class="btn btn-primary" style="text-decoration:none; padding:15px 30px; background:#059669;">View Messages</a>
          </div>
      </div>

    </div>
  </div>

  <script src="js/super-layout.js"></script>
  <script>
      async function loadStats() {
          try {
              const res = await fetch("http://127.0.0.1:8000/api/v1/superadmin/dashboard", {
                  headers: { Authorization: "Bearer " + token }
              });
              const data = await res.json();
              document.getElementById("totalOrgs").textContent = data.total_organizations;
              document.getElementById("totalStudents").textContent = data.total_students;
              document.getElementById("totalTeachers").textContent = data.total_teachers;
              document.getElementById("totalCourses").textContent = data.total_courses;
          } catch(e) {}
      }
      loadStats();
  </script>
</body>
</html>
